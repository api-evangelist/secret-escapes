name: Secret Escapes
description: 'Secret Escapes is a members-only luxury travel and holiday flash-sales
  platform that negotiates exclusive, time-limited discounts on hand-picked hotels,
  city breaks, and package holidays for its members, surfacing over 200 curated sales
  each week across the UK and international markets. Founded in London and backed by
  GV and Index Ventures, it operates on an invitation/membership model rather than
  a public developer platform; no public API surface is currently published.'
